<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐볼HANDONG - 로그인</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;

    background:
    url("https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{

    width:400px;

    background:white;

    padding:40px;

    border-radius:40px;

    text-align:center;
}

.logo{
    font-size:36px;
    margin-bottom:10px;
}

.title{
    font-size:28px;
    margin-bottom:20px;
}

.subtitle{
    color:#716c6c;
    margin-bottom:30px;
}

input{

    width:100%;

    padding:15px;

    margin-bottom:15px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;
}

.login-btn{

    display:block;

    width:100%;

    padding:15px;

    background:#2563eb;

    color:white;

    text-decoration:none;

    border-radius:10px;

    font-size:18px;

    font-weight:bold;

    transition:0.3s;
}


.guest-btn{

    display:block;

    margin-top:15px;

    color:#2563eb;

    text-decoration:none;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🎬</div>

    <h1 class="title">뭐볼HANDONG</h1>

    <p class="subtitle">
        지금 당장 뭘 볼지 고민하기 싫은<br>
        한동인을 위한 추천 플랫폼
    </p>

    <input type="text" placeholder="학번 또는 아이디">

    <input type="password" placeholder="비밀번호">

    <!-- 클릭하면 메인페이지 이동 -->
    <a href="메인페이지.html" class="login-btn">
        로그인
    </a>

    <a href="메인페이지.html" class="guest-btn">
        게스트로 둘러보기
    </a>

</div>

</body>
</html>
